
name: MAI Nexus AI Education Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install alembic sqlalchemy pydantic-settings psycopg2-binary

      - name: Check Education migration configuration
        working-directory: backend
        run: alembic -c alembic.ini history
