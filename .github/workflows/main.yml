name: MAI Nexus AI Education Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax and Education Migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install alembic sqlalchemy pydantic-settings psycopg2-binary pytest fastapi httpx

      - name: Run Education model tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./education_ci.db"
          SECRET_KEY: "ci-only-test-secret-not-for-production"
        run: python -m pytest tests/test_education_school.py -v

      - name: Check Education migration history
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./education_ci.db"
          SECRET_KEY: "ci-only-test-secret-not-for-production"
        run: alembic -c alembic.ini history

      - name: Upgrade Education database
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./education_ci.db"
          SECRET_KEY: "ci-only-test-secret-not-for-production"
        run: alembic -c alembic.ini upgrade head

      - name: Downgrade Education database
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./education_ci.db"
          SECRET_KEY: "ci-only-test-secret-not-for-production"
        run: alembic -c alembic.ini downgrade base
